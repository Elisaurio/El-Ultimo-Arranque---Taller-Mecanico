<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<aside th:fragment="sidebar(active)" class="sidebar">
<a class="brand" th:href="@{/}"><span class="brand-mark">✦</span><span>El Último<br>Arranque</span></a>
<p class="side-label">PANEL DEL TALLER</p>
<nav aria-label="Navegación principal" class="side-nav">
<a th:classappend="${active == 'inicio'} ? ' selected' : ''" th:href="@{/}"><span>⌂</span> Inicio</a>
<a th:classappend="${active == 'clientes'} ? ' selected' : ''" th:href="@{/clientes}"><span>♙</span> Clientes</a>
<a th:classappend="${active == 'vehiculos'} ? ' selected' : ''" th:href="@{/vehiculos}"><span>◇</span> Vehículos</a>
<a th:classappend="${active == 'mecanicos'} ? ' selected' : ''" th:href="@{/mecanicos}"><span>⚒</span> Mecánicos</a>
<a th:classappend="${active == 'repuestos'} ? ' selected' : ''" th:href="@{/repuestos}"><span>▣</span> Repuestos</a>
<a th:classappend="${active == 'servicios'} ? ' selected' : ''" th:href="@{/servicios}"><span>✧</span> Servicios</a>
<a th:classappend="${active == 'ordenes'} ? ' selected' : ''" th:href="@{/ordenes}"><span>▤</span> Órdenes</a>
<a th:classappend="${active == 'reportes'} ? ' selected' : ''" th:href="@{/reportes}"><span>&#9635;</span> Reportes</a>
</nav>
<div class="side-footer">Programación II · MVC<br><small>Java + Spring Boot + MySQL</small></div>
</aside>
<header th:fragment="topbar(title, subtitle)" class="topbar">
<div><div class="top-eyebrow">EL ÚLTIMO ARRANQUE · GESTIÓN DEL TALLER</div><h1 th:text="${title}">Inicio</h1><p th:text="${subtitle}">Bienvenido</p></div>
<div class="top-icon" aria-hidden="true">✦</div>
</header>
</body></html>
