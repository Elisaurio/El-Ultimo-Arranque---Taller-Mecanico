<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio · El Último Arranque</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css(v=ui6)}">
  <link rel="stylesheet" th:href="@{/css/etapa5.css(v=1)}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('inicio')}"></aside>
  <main class="content">
    <header th:replace="~{fragments/layout :: topbar('¡Bienvenido al taller!','')}"></header>
    <section class="stats-grid stats-grid--compact" aria-label="Resumen del taller">
      <div class="stat stat-inline"><span>Clientes</span><strong th:text="${totalClientes}">0</strong></div>
      <div class="stat stat-inline"><span>Órdenes</span><strong th:text="${totalOrdenes}">0</strong></div>
      <div class="stat stat-inline"><span>Vehículos</span><strong th:text="${totalVehiculos}">0</strong></div>
    </section>
    <div class="section-title"><h2>Accesos rápidos</h2></div>
    <section class="feature-grid feature-grid--three" aria-label="Accesos rápidos">
      <a class="feature" th:href="@{/clientes}">
        <span class="feature-icon"><svg class="feature-line-icon" aria-hidden="true"><use href="#icon-user"/></svg></span>
        <div><h3>Clientes</h3><p>Consultar y registrar clientes</p></div><span class="feature-arrow">›</span>
      </a>
      <a class="feature" th:href="@{/repuestos}">
        <span class="feature-icon"><svg class="feature-line-icon" aria-hidden="true"><use href="#icon-gear"/></svg></span>
        <div><h3>Repuestos</h3><p>Catálogo e inventario</p></div><span class="feature-arrow">›</span>
      </a>
      <a class="feature" th:href="@{/ordenes/nueva}">
        <span class="feature-icon"><svg class="feature-line-icon" aria-hidden="true"><use href="#icon-file"/></svg></span>
        <div><h3>Crear nueva orden</h3><p>Iniciar una orden de trabajo</p></div><span class="feature-arrow">›</span>
      </a>
    </section>
  </main>
</div>
</body>
</html>
