<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulario · Mecánicos</title><link rel="stylesheet" th:href="@{/css/estilos.css(v=etapa34)}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('mecanicos')}"></aside><main class="content"><header th:replace="~{fragments/layout :: topbar('Mecánicos', 'Registro y edición')}"></header>
<div class="page-actions"><h2 th:text="${registro.id == null} ? 'Nuevo mecánico' : 'Editar mecánico'">Formulario</h2><a class="btn ghost" th:href="@{/mecanicos}">Volver</a></div>
<form class="form-card" th:object="${registro}" th:action="@{/mecanicos/guardar}" method="post"><input type="hidden" th:field="*{id}"><div class="notice error" th:if="${#fields.hasGlobalErrors()}"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p></div><div class="form-grid"><div class="field"><label for="identificador">Identificador</label><input th:field="*{identificador}" required /><small class="validation" th:errors="*{identificador}"></small></div>
<div class="field"><label for="nombre">Nombre</label><input th:field="*{nombre}" required /><small class="validation" th:errors="*{nombre}"></small></div>
<div class="field"><label for="telefono">Telefono</label><input th:field="*{telefono}" /><small class="validation" th:errors="*{telefono}"></small></div>
<div class="field"><label for="especialidad">Especialidad</label><input th:field="*{especialidad}" /><small class="validation" th:errors="*{especialidad}"></small></div>
</div><div class="form-actions"><a class="btn ghost" th:href="@{/mecanicos}">Cancelar</a><button class="btn primary" type="submit">Guardar</button></div></form></main></div></body></html>
