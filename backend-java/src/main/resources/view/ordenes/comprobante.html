<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comprobante · El Último Arranque</title><link rel="stylesheet" th:href="@{/css/estilos.css(v=etapa34)}"><link rel="stylesheet" th:href="@{/css/etapa5.css(v=1)}"></head>
<body class="receipt-page"><div class="receipt-actions"><a class="btn ghost" th:href="@{/ordenes/{id}(id=${orden.id})}">Volver a la orden</a><button class="btn primary" type="button" onclick="window.print()">Imprimir / Guardar como PDF</button></div>
<article class="receipt"><header><h1>El Último Arranque</h1><p>Comprobante de reparación</p><h2 th:text="${'Orden #' + orden.id}">Orden</h2></header>
<dl class="detail-grid"><div><dt>Cliente</dt><dd th:text="${orden.clienteNombre}"></dd></div><div><dt>Vehículo</dt><dd th:text="${orden.placa}"></dd></div><div><dt>Mecánico</dt><dd th:text="${orden.mecanicoNombre}"></dd></div><div><dt>Finalización</dt><dd th:text="${#temporals.format(orden.fechaFinalizacion,'dd/MM/yyyy HH:mm')}"></dd></div></dl>
<p><strong>Motivo:</strong> <span th:text="${orden.problema}"></span></p>
<h3>Servicios</h3><table><thead><tr><th>Servicio</th><th>Importe</th></tr></thead><tbody><tr th:each="s : ${serviciosAplicados}"><td th:text="${s.descripcion}"></td><td th:text="${'Q ' + s.costoAplicado}"></td></tr></tbody></table>
<h3>Repuestos</h3><table><thead><tr><th>Repuesto</th><th>Cant.</th><th>Unitario</th><th>Subtotal</th></tr></thead><tbody><tr th:each="r : ${repuestosAplicados}"><td th:text="${r.nombre}"></td><td th:text="${r.cantidad}"></td><td th:text="${'Q ' + r.precioUnitarioAplicado}"></td><td th:text="${'Q ' + r.subtotal}"></td></tr></tbody></table>
<div class="receipt-totals"><p>Mano de obra: <strong th:text="${'Q ' + orden.totalManoObra}"></strong></p><p>Repuestos: <strong th:text="${'Q ' + orden.totalRepuestos}"></strong></p><h2>Total: <span th:text="${'Q ' + orden.total}"></span></h2></div>
<footer>Documento generado por El Último Arranque · Estado FINALIZADA</footer></article></body></html>
