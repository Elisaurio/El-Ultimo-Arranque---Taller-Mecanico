<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abastecer repuesto</title><link rel="stylesheet" th:href="@{/css/estilos.css(v=etapa34)}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('repuestos')}"></aside><main class="content"><header th:replace="~{fragments/layout :: topbar('Abastecimiento', 'Sumar unidades al inventario')}"></header><div class="page-actions"><h2 th:text="${registro.nombre}">Repuesto</h2><a class="btn ghost" th:href="@{/repuestos}">Volver</a></div><div class="notice error" th:if="${error}" th:text="${error}"></div><form class="form-card" th:action="@{/repuestos/{id}/abastecer(id=${registro.id})}" method="post"><p>Existencia actual: <strong th:text="${registro.existencia}">0</strong></p><div class="field"><label for="cantidad">Unidades a agregar</label><input id="cantidad" name="cantidad" type="number" min="1" max="100000" step="1" required></div><div class="form-actions"><button class="btn primary" type="submit">Sumar al inventario</button></div></form></main></div></body></html>
