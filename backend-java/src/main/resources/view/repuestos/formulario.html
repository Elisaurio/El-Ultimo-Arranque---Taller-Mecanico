<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulario · Repuestos</title><link rel="stylesheet" th:href="@{/css/estilos.css(v=etapa34)}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('repuestos')}"></aside><main class="content"><header th:replace="~{fragments/layout :: topbar('Repuestos', 'Registro y edición')}"></header>
<div class="page-actions"><h2 th:text="${registro.id == null} ? 'Nuevo repuesto' : 'Editar repuesto'">Formulario</h2><a class="btn ghost" th:href="@{/repuestos}">Volver</a></div>
<form class="form-card" th:object="${registro}" th:action="@{/repuestos/guardar}" method="post"><input type="hidden" th:field="*{id}"><div class="notice error" th:if="${#fields.hasGlobalErrors()}"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p></div><div class="form-grid"><div class="field"><label for="codigo">Codigo</label><input th:field="*{codigo}" required /><small class="validation" th:errors="*{codigo}"></small></div>
<div class="field"><label for="nombre">Nombre</label><input th:field="*{nombre}" required /><small class="validation" th:errors="*{nombre}"></small></div>
<div class="field"><label for="descripcion">Descripcion</label><input th:field="*{descripcion}" /><small class="validation" th:errors="*{descripcion}"></small></div>
<div class="field"><label for="precio">Precio (Q)</label><input type="number" th:field="*{precio}" step="0.01" min="0" required><small class="validation" th:errors="*{precio}"></small></div>
<div class="field"><label for="existencia">Existencia inicial</label><input type="number" min="0" step="1" th:field="*{existencia}" th:readonly="${registro.id != null}" required><small th:if="${registro.id != null}">Para sumar existencias utiliza Abastecer, no Editar.</small><small class="validation" th:errors="*{existencia}"></small></div>
</div><div class="form-actions"><a class="btn ghost" th:href="@{/repuestos}">Cancelar</a><button class="btn primary" type="submit">Guardar</button></div></form></main></div></body></html>
