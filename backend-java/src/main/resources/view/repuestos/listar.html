<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repuestos · El Último Arranque</title><link rel="stylesheet" th:href="@{/css/estilos.css(v=etapa34)}"></head><body>
<div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('repuestos')}"></aside><main class="content">
<header th:replace="~{fragments/layout :: topbar('Repuestos', 'Administración del taller')}"></header>
<div class="page-actions"><h2>Repuestos registrados</h2><div class="actions"><a class="btn ghost" th:href="@{/repuestos/bajo-inventario}">Inventario ≤ 5</a><a class="btn primary" th:href="@{/repuestos/nuevo}">+ Nuevo repuesto</a></div></div>
<div th:if="${exito}" class="notice success" th:text="${exito}"></div><div th:if="${error}" class="notice error" th:text="${error}"></div>
<div class="table-card"><div class="table-scroll"><table><thead><tr><th>Codigo</th><th>Nombre</th><th>Descripcion</th><th>Precio</th><th>Existencia</th><th>Acciones</th></tr></thead><tbody><tr th:each="r : ${registros}"><td th:text="${r.codigo}">—</td><td th:text="${r.nombre}">—</td><td th:text="${r.descripcion}">—</td><td th:text="${r.precio}">—</td><td th:text="${r.existencia}">—</td><td class="actions"><a th:href="@{/repuestos/{id}/abastecer(id=${r.id})}">Abastecer</a><a th:href="@{/repuestos/{id}/editar(id=${r.id})}">Editar</a><form th:action="@{/repuestos/{id}/eliminar(id=${r.id})}" method="post" onsubmit="return confirm('¿Eliminar el registro?');"><button class="danger-link" type="submit">Eliminar</button></form></td></tr><tr th:if="${#lists.isEmpty(registros)}"><td colspan="6" class="empty">No hay registros todavía</td></tr></tbody></table></div></div>
</main></div></body></html>
