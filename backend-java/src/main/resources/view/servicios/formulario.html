<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulario · Servicios</title><link rel="stylesheet" th:href="@{/css/estilos.css(v=etapa34)}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('servicios')}"></aside><main class="content"><header th:replace="~{fragments/layout :: topbar('Servicios', 'Registro y edición')}"></header>
<div class="page-actions"><h2 th:text="${registro.id == null} ? 'Nuevo servicio' : 'Editar servicio'">Formulario</h2><a class="btn ghost" th:href="@{/servicios}">Volver</a></div>
<form class="form-card" th:object="${registro}" th:action="@{/servicios/guardar}" method="post"><input type="hidden" th:field="*{id}"><div class="notice error" th:if="${#fields.hasGlobalErrors()}"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p></div><div class="form-grid"><div class="field"><label for="codigo">Codigo</label><input th:field="*{codigo}" required /><small class="validation" th:errors="*{codigo}"></small></div>
<div class="field"><label for="descripcion">Descripcion</label><input th:field="*{descripcion}" required /><small class="validation" th:errors="*{descripcion}"></small></div>
<div class="field"><label for="costoManoObra">Costo de mano de obra (Q)</label><input type="number" th:field="*{costoManoObra}" step="0.01" min="0" required><small class="validation" th:errors="*{costoManoObra}"></small></div>
</div><div class="form-actions"><a class="btn ghost" th:href="@{/servicios}">Cancelar</a><button class="btn primary" type="submit">Guardar</button></div></form></main></div></body></html>
