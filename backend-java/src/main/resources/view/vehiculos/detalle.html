<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historial del vehículo</title><link rel="stylesheet" th:href="@{/css/estilos.css(v=etapa34)}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('vehiculos')}"></aside><main class="content"><header th:replace="~{fragments/layout :: topbar('Historial del vehículo', 'Órdenes asociadas a su placa')}"></header><div class="page-actions"><h2 th:text="${registro.placa}">Placa</h2><a th:href="@{/vehiculos}" class="btn ghost">Volver</a></div><div class="table-card"><div class="table-scroll"><table><thead><tr><th>Orden</th><th>Estado</th><th>Fecha</th><th>Problema</th><th>Total</th></tr></thead><tbody><tr th:each="o : ${historial}"><td th:text="${o.id}"></td><td th:text="${o.estado}"></td><td th:text="${o.fecha}"></td><td th:text="${o.problema}"></td><td th:text="${o.total}"></td></tr><tr th:if="${#lists.isEmpty(historial)}"><td colspan="5" class="empty">Aún no existen órdenes para este vehículo</td></tr></tbody></table></div></div></main></div></body></html>
