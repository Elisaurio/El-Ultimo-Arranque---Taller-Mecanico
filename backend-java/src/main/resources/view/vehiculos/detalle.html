<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historial · El Último Arranque</title><link rel="stylesheet" th:href="@{/css/estilos.css(v=etapa34)}"><link rel="stylesheet" th:href="@{/css/etapa5.css(v=1)}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('vehiculos')}"></aside><main class="content">
<header th:replace="~{fragments/layout :: topbar('Historial del vehículo','Reparaciones y propiedad')}"></header>
<div class="page-actions"><h2 th:text="${registro.placa}">Placa</h2><a class="btn ghost" th:href="@{/vehiculos}">Volver</a></div>
<div class="form-card"><p><strong>Propietario:</strong> <a th:href="@{/clientes/{id}(id=${cliente.id})}" th:text="${cliente.identificador + ' · ' + cliente.nombre}"></a></p><p th:text="${registro.marca + ' ' + registro.modelo}"></p></div>
<div class="page-actions"><h2>Órdenes relacionadas</h2></div>
<div class="table-card"><div class="table-scroll"><table><thead><tr><th>Orden</th><th>Estado</th><th>Fecha</th><th>Problema</th><th>Total</th></tr></thead><tbody>
<tr th:each="o : ${historial}"><td><a th:href="@{/ordenes/{id}(id=${o.id})}" th:text="${'#' + o.id}"></a></td><td th:text="${o.estado}"></td><td th:text="${o.fecha}"></td><td th:text="${o.problema}"></td><td th:text="${'Q ' + o.total}"></td></tr><tr th:if="${#lists.isEmpty(historial)}"><td class="empty" colspan="5">Sin órdenes todavía</td></tr>
</tbody></table></div></div></main></div></body></html>
