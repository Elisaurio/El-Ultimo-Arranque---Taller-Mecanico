<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulario · Vehículos</title><link rel="stylesheet" th:href="@{/css/estilos.css(v=etapa34)}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('vehiculos')}"></aside><main class="content"><header th:replace="~{fragments/layout :: topbar('Vehículos', 'Registro y edición')}"></header>
<div class="page-actions"><h2 th:text="${registro.id == null} ? 'Nuevo vehículo' : 'Editar vehículo'">Formulario</h2><a class="btn ghost" th:href="@{/vehiculos}">Volver</a></div>
<form class="form-card" th:object="${registro}" th:action="@{/vehiculos/guardar}" method="post"><input type="hidden" th:field="*{id}"><div class="notice error" th:if="${#fields.hasGlobalErrors()}"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p></div><div class="form-grid"><div class="field"><label for="clienteId">Cliente propietario</label><select th:field="*{clienteId}" required><option value="">Selecciona un cliente</option><option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.identificador + ' · ' + c.nombre}"></option></select><small class="validation" th:errors="*{clienteId}"></small></div>
<div class="field"><label for="placa">Placa</label><input th:field="*{placa}" required /><small class="validation" th:errors="*{placa}"></small></div>
<div class="field"><label for="marca">Marca</label><input th:field="*{marca}" required /><small class="validation" th:errors="*{marca}"></small></div>
<div class="field"><label for="modelo">Modelo</label><input th:field="*{modelo}" required /><small class="validation" th:errors="*{modelo}"></small></div>
<div class="field"><label for="anio">Año</label><input type="number" th:field="*{anio}" step="1" min="1900" max="2100"><small class="validation" th:errors="*{anio}"></small></div>
<div class="field"><label for="color">Color</label><input th:field="*{color}" /><small class="validation" th:errors="*{color}"></small></div>
</div><div class="form-actions"><a class="btn ghost" th:href="@{/vehiculos}">Cancelar</a><button class="btn primary" type="submit">Guardar</button></div></form></main></div></body></html>
