<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehículos · El Último Arranque</title><link rel="stylesheet" th:href="@{/css/estilos.css(v=etapa34)}"><link rel="stylesheet" th:href="@{/css/etapa5.css(v=1)}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('vehiculos')}"></aside><main class="content">
<header th:replace="~{fragments/layout :: topbar('Vehículos','Todos los vehículos tienen un cliente asignado')}"></header>
<div class="page-actions"><h2>Vehículos registrados</h2><a class="btn primary" th:href="@{/vehiculos/nuevo}">+ Nuevo vehículo</a></div>
<div th:if="${exito}" class="notice success" th:text="${exito}"></div><div th:if="${error}" class="notice error" th:text="${error}"></div>
<div class="table-card"><div class="table-scroll"><table><thead><tr><th>Placa</th><th>Cliente asignado</th><th>Marca</th><th>Modelo</th><th>Año</th><th>Acciones</th></tr></thead><tbody>
<tr th:each="v : ${registros}"><td th:text="${v.placa}"></td><td th:text="${clientesPorId[v.clienteId]}"></td><td th:text="${v.marca}"></td><td th:text="${v.modelo}"></td><td th:text="${v.anio}"></td><td class="actions"><a th:href="@{/vehiculos/{id}(id=${v.id})}">Historial</a><a th:href="@{/vehiculos/{id}/editar(id=${v.id})}">Editar</a><form th:action="@{/vehiculos/{id}/eliminar(id=${v.id})}" method="post" onsubmit="return confirm('¿Eliminar este vehículo?');"><button class="danger-link" type="submit">Eliminar</button></form></td></tr>
<tr th:if="${#lists.isEmpty(registros)}"><td colspan="6" class="empty">No hay vehículos todavía. Registra uno y asígnale un cliente.</td></tr>
</tbody></table></div></div>
</main></div></body></html>
