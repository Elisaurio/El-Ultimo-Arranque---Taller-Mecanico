<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vehículos · El Último Arranque</title><link rel="stylesheet" th:href="@{/css/estilos.css(v=etapa34)}"></head><body>
<div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('vehiculos')}"></aside><main class="content">
<header th:replace="~{fragments/layout :: topbar('Vehículos', 'Administración del taller')}"></header>
<div class="page-actions"><h2>Vehículos registrados</h2><div class="actions"><a class="btn primary" th:href="@{/vehiculos/nuevo}">+ Nuevo vehículo</a></div></div>
<div th:if="${exito}" class="notice success" th:text="${exito}"></div><div th:if="${error}" class="notice error" th:text="${error}"></div>
<div class="table-card"><div class="table-scroll"><table><thead><tr><th>Placa</th><th>Marca</th><th>Modelo</th><th>Año</th><th>Color</th><th>Acciones</th></tr></thead><tbody><tr th:each="r : ${registros}"><td th:text="${r.placa}">—</td><td th:text="${r.marca}">—</td><td th:text="${r.modelo}">—</td><td th:text="${r.anio}">—</td><td th:text="${r.color}">—</td><td class="actions"><a th:href="@{/vehiculos/{id}(id=${r.id})}">Historial</a><a th:href="@{/vehiculos/{id}/editar(id=${r.id})}">Editar</a><form th:action="@{/vehiculos/{id}/eliminar(id=${r.id})}" method="post" onsubmit="return confirm('¿Eliminar el registro?');"><button class="danger-link" type="submit">Eliminar</button></form></td></tr><tr th:if="${#lists.isEmpty(registros)}"><td colspan="6" class="empty">No hay registros todavía</td></tr></tbody></table></div></div>
</main></div></body></html>
